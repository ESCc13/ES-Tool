name: 源码检查与构建

# 说明：
#   本仓库只放 ES Tool 自己的源码。编译需要两类第三方产物，它们不在仓库里
#   （体积上百 MB，且不属于本项目版权物）：
#     1) ModPcGUI/pcl/PCL.Core.dll 等 —— PCL2 程序集
#     2) modpc/ModPc/*.dll、Login.exe —— 原版挂服机运行目录
#   所以 CI 会先探测依赖：齐全才真正编译，缺了就跳过编译并在摘要里写明原因，
#   保证流水线不会因为「仓库里没有别人的二进制」而永远报红。

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 工程用了 LangVersion 14.0（C# 14），SDK 低于 10 会直接报 CS1617
          dotnet-version: 10.0.x

      - name: 源码完整性检查
        shell: bash
        run: |
          set -e
          fail=0
          for f in \
            ModPcGUI/src/ModPcGUI.csproj \
            ModPcGUI/src/UI/PclMainWindow.cs \
            ModPcGUI/src/UI/PclMainWindow.Layout.cs \
            ModPcGUI/src/UI/PclMainWindow.Lobby.cs \
            ModPcGUI/src/UI/SetNameDialog.cs \
            ModPcGUI/src/UI/Boot.cs \
            ModPcGUI/src/UI/AppHost.cs \
            ModPcGUI/src/text/app.cs \
            README.md LICENSE
          do
            if [ -f "$f" ]; then
              echo "OK   $f"
            else
              echo "MISS $f"
              fail=1
            fi
          done
          echo "源码 .cs 文件数：$(find ModPcGUI/src -name '*.cs' | wc -l)"
          exit $fail

      - name: 探测第三方依赖
        id: deps
        shell: bash
        run: |
          ok=1
          for f in \
            ModPcGUI/pcl/PCL.Core.dll \
            ModPcGUI/pcl/MeloongCore.dll \
            ModPcGUI/pcl/MeloongCore.Wpf.dll \
            modpc/ModPc/Mcl.Core.dll \
            modpc/ModPc/Newtonsoft.Json.dll
          do
            if [ -f "$f" ]; then echo "OK   $f"; else echo "MISS $f"; ok=0; fi
          done
          echo "has_deps=$ok" >> "$GITHUB_OUTPUT"

      - name: 编译（依赖齐全时）
        if: steps.deps.outputs.has_deps == '1'
        shell: bash
        run: dotnet build ModPcGUI/src/ModPcGUI.csproj -c Release --nologo

      - name: 跳过编译（依赖缺失）
        if: steps.deps.outputs.has_deps != '1'
        shell: bash
        run: |
          {
            echo "### 已跳过编译"
            echo ""
            echo "仓库里没有 PCL2 程序集与原版 modpc 运行目录，编译所需的引用不齐。"
            echo "按 README 的「准备运行环境」把下面两处补齐后，本流水线会自动开始编译："
            echo ""
            echo '```'
            echo "ModPcGUI/pcl/        ← PCL2 程序集（Plain Craft Launcher 2.exe 改名为 PCL.Core.dll）"
            echo "modpc/ModPc/         ← 原版挂服机运行目录（Login.exe + Mcl.Core.dll 等）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "依赖缺失，跳过编译（源码检查已通过）。"

      - name: 上传构建产物
        if: steps.deps.outputs.has_deps == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ModPcGUI-net48
          path: ModPcGUI/src/bin/Release/net48/
          if-no-files-found: warn
